<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{
  --bg:#000000; --card:#0c1220; --card2:#131c2e; --text:#eaf1ff; --muted:#8696b4; --line:#1c2840;
  --brand:#3b82f6; --brand-soft:#0f2547; --green:#34d399; --green-soft:#0d2e24; --red:#f87171; --red-soft:#341417;
  --amber:#fbbf24; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px}
body{padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 84px)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
header.top h1{font-size:20px;margin:0;font-weight:800}
.sync{font-size:11.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:3px 9px;border-radius:99px;white-space:nowrap}
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px;margin-bottom:12px;box-shadow:var(--shadow)}
.monthbar button{width:38px;height:38px;border-radius:10px;font-size:20px;color:var(--brand)}
.monthbar button:active{background:var(--brand-soft)}
.monthbar .m{font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h3 small{font-weight:500;color:var(--muted);font-size:12.5px}
.card.hero{border:0}
.hero{background:linear-gradient(135deg,#1e3a8a,#2563eb 60%,#3b82f6);color:#fff}
.hero .lbl{opacity:.85;font-size:13px}
.hero .big{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
.hero .unit{font-size:14px;opacity:.85;font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.stats div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px}
.stats span{display:block;font-size:11.5px;opacity:.85}
.stats b{font-size:14px;font-weight:700}
.accs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.accs::-webkit-scrollbar{display:none}
.acc{min-width:140px;background:var(--card2);border-radius:14px;padding:10px 12px}
.acc .n{font-size:13px;color:var(--muted)}
.acc .v{font-weight:700;margin-top:4px}
.neg{color:var(--red)!important}
.pos{color:var(--green)!important}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:right}
.tx:last-child{border-bottom:0}
.tx .ic{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:19px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .end{text-align:left;flex:none}
.tx .amt{font-weight:700;white-space:nowrap}
.tx .d{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.dayhead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:6px 4px 2px}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px;line-height:1.9}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.budget{padding:8px 0}
.budget .row{display:flex;justify-content:space-between;font-size:13.5px}
.budget .row small{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px 8px;padding:0 14px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.sumbar{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.sumbar b{display:block;font-size:15px;margin-top:2px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:8px;outline:none}
.search:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:space-around;align-items:center;z-index:20}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 8px;min-width:58px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--brand)}
nav.tabs .add{width:54px;height:54px;border-radius:18px;background:var(--brand);color:#fff;margin-top:-24px;box-shadow:0 6px 20px rgba(59,130,246,.45);justify-content:center;min-width:0;padding:0}
nav.tabs .add svg{width:28px;height:28px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 10px}
.sheet h2{font-size:17px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 0;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button.on.exp{color:var(--red)} .seg button.on.inc{color:var(--green)} .seg button.on.trf{color:var(--brand)}
.amountbox{background:var(--card);border-radius:16px;padding:14px;text-align:center;margin-bottom:12px}
.amountbox input{width:100%;border:0;background:none;text-align:center;font-size:30px;font-weight:800;outline:none;direction:ltr}
.amountbox .hint{font-size:12.5px;color:var(--muted);min-height:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin:0 4px 5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none;appearance:none;-webkit-appearance:none}
.field textarea{min-height:110px;direction:ltr;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.row3{display:grid;grid-template-columns:1fr 1.4fr 1.1fr;gap:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:8px 2px;text-align:center;font-size:11.5px;line-height:1.5}
.cat b{display:block;font-size:20px;font-weight:400}
.cat.on{border-color:var(--brand);background:var(--brand-soft)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:15.5px;text-align:center}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn+.btn{margin-top:8px}
.btn:active{opacity:.85}
.list .item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:right}
.list .item:last-child{border-bottom:0}
.list .item .ic{font-size:20px;width:30px;text-align:center}
.list .item .mid{flex:1}
.list .item small{color:var(--muted);display:block;font-size:12px}
.linkbtn{color:var(--brand);font-weight:600;font-size:13.5px}
.legend .item{padding:8px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%);background:var(--brand);color:#fff;padding:9px 16px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:.95}
.note{font-size:13px;color:var(--muted);line-height:1.9}
.note b{color:var(--text)}
.muted{color:var(--muted)}
svg text{font-family:Vazirmatn,Tahoma,sans-serif}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">

<nav class="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>خانه</button>

  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>تنظیمات</button>
</nav>

<script>
if(/\/hesab$/.test(location.pathname)) location.replace(location.pathname+'/'+location.search+location.hash);
/* ===================== Jalali calendar (jalaali algorithm) ===================== */
function div(a,b){return ~~(a/b)} function mod(a,b){return a-~~(a/b)*b}
const BREAKS=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let gy=jy+621,leapJ=-14,jp=BREAKS[0],jm,jump=0,leap,leapG,march,n,i;
  for(i=1;i<BREAKS.length;i++){jm=BREAKS[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
  n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;
  return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd}}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy);const f=g2d(gy,3,r.march);let k=jdn-f,jm,jd;
  if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy,jm,jd}}k-=186}else{jy-=1;k+=179;if(r.leap===1)k+=1}
  jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd}}
function monthLen(jy,jm){return jm<=6?31:jm<=11?30:(jalCal(jy).leap===0?30:29)}
function todayJ(offsetDays=0){const d=new Date();return d2j(g2d(d.getFullYear(),d.getMonth()+1,d.getDate())+offsetDays)}
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEK=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const pad=n=>String(n).padStart(2,'0');
const jStr=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const parseJ=s=>{const [y,m,d]=s.split('-').map(Number);return{jy:y,jm:m,jd:d}};
function weekday(s){const {jy,jm,jd}=parseJ(s);const g=d2g(j2d(jy,jm,jd));return WEEK[new Date(g.gy,g.gm-1,g.gd).getDay()]}

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const FD='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s).replace(/\d/g,d=>FD[d]);
const toEn=s=>String(s).replace(/[۰-۹]/g,d=>FD.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const grp=n=>fa(Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'٬'));
const unit=()=>S.meta.settings.currency||'تومان';
const money=(n,sign)=>(sign&&n<0?'−':'')+grp(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const PALETTE=['#2f6df6','#e5484d','#13a26b','#f59e0b','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6','#6366f1','#a3a3a3'];
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200)}
function words(n){ // human-readable amount hint
  n=Math.round(n); if(!n) return '';
  const parts=[];const b=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3;
  if(b)parts.push(fa(b)+' میلیارد'); if(m)parts.push(fa(m)+' میلیون'); if(k)parts.push(fa(k)+' هزار'); if(r)parts.push(fa(r));
  return parts.join(' و ')+' '+unit();
}

/* ===================== data ===================== */
const DEFAULT_META={
  accounts:[{id:'cash',name:'نقدی',icon:'💵',initial:0},{id:'bank',name:'کارت بانکی',icon:'💳',initial:0}],
  categories:[
    {id:'food',name:'خوراک و رستوران',icon:'🍽️',type:'expense',budget:0},
    {id:'grocery',name:'سوپرمارکت',icon:'🛒',type:'expense',budget:0},
    {id:'transport',name:'حمل‌ونقل',icon:'🚕',type:'expense',budget:0},
    {id:'bills',name:'قبوض و شارژ',icon:'💡',type:'expense',budget:0},
    {id:'home',name:'اجاره و خانه',icon:'🏠',type:'expense',budget:0},
    {id:'loan',name:'قسط و بدهی',icon:'📄',type:'expense',budget:0},
    {id:'clothes',name:'پوشاک',icon:'👕',type:'expense',budget:0},
    {id:'health',name:'سلامت',icon:'💊',type:'expense',budget:0},
    {id:'fun',name:'تفریح',icon:'🎬',type:'expense',budget:0},
    {id:'edu',name:'آموزش',icon:'📚',type:'expense',budget:0},
    {id:'gift',name:'هدیه',icon:'🎁',type:'expense',budget:0},
    {id:'subs',name:'اشتراک',icon:'🔁',type:'expense',budget:0},
    {id:'gold',name:'طلا',icon:'🥇',type:'expense',budget:0},
    {id:'silver',name:'نقره',icon:'🥈',type:'expense',budget:0},
    {id:'other',name:'سایر',icon:'📦',type:'expense',budget:0},
    {id:'salary',name:'حقوق',icon:'💼',type:'income',budget:0},
    {id:'business',name:'فروش و کسب‌وکار',icon:'🛍️',type:'income',budget:0},
    {id:'profit',name:'سود و بهره',icon:'📈',type:'income',budget:0},
    {id:'giftin',name:'هدیه',icon:'🎁',type:'income',budget:0},
    {id:'otherin',name:'سایر',icon:'➕',type:'income',budget:0}
  ],
  settings:{currency:'تومان'}
};
const LS_KEY='hesab-man-v1';
let S={meta:clone(DEFAULT_META),months:{}}; // months: {'m-1405-08':[tx,...]}
try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);if(o&&o.meta)S=o}}catch(e){}
(function migrate(){const m=S.meta;m.migrations=m.migrations||[];
  if(!m.migrations.includes('cats-subs-gold-silver')){
    const add=DEFAULT_META.categories.filter(c=>['subs','gold','silver'].includes(c.id)&&!m.categories.some(x=>x.id===c.id));
    const i=m.categories.findIndex(c=>c.id==='other');
    m.categories.splice(i>=0?i:m.categories.length,0,...clone(add));
    m.migrations.push('cats-subs-gold-silver');
    try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}
  }})();
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
const mKey=(y,m)=>`m-${y}-${pad(m)}`;
const keyOfDate=s=>'m-'+s.slice(0,7);
const allTx=()=>Object.values(S.months).flat();
const acc=id=>S.meta.accounts.find(a=>a.id===id);
const cat=id=>S.meta.categories.find(c=>c.id===id);

/* ===================== cloud sync (private per-person store) ===================== */
let col=null, mode='init';
const dirty={}, writing={};
function setMode(m){mode=m;const el=$('#sync');
  el.textContent = m==='cloud'?'☁️ همگام با حساب Claude': m==='local'?'📱 ذخیره روی همین گوشی': m==='wait'?'⏳ فضای ابری در دسترس نیست':'در حال بارگذاری…';}
function persist(key){
  saveLocal();
  if(!col||mode!=='cloud') return;
  dirty[key]=true; if(writing[key]) return;
  writing[key]=(async()=>{
    while(dirty[key]){dirty[key]=false;
      const body= key==='meta'? clone(S.meta) : {items:clone(S.months[key]||[])};
      try{await col.doc(key).set(body)}
      catch(e){ if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));dirty[key]=true;continue}
        if(e&&e.code==='quota_exceeded') toast('فضای ذخیره پر شده است؛ یک پشتیبان بگیرید');
        else if(e&&(e.code==='invalid_argument'||e.code==='revoked')){setMode('local');toast('ذخیرهٔ ابری ممکن نیست؛ داده روی همین دستگاه ذخیره شد')}
        else toast('ذخیرهٔ ابری ناموفق بود');
      }
    }
    writing[key]=null;
  })();
}
function applyDoc(d){
  if(d.metadata.hasPendingWrites||dirty[d.id]||writing[d.id]) return;
  const body=d.data(); if(!body) return;
  if(d.id==='meta') S.meta=Object.assign(clone(DEFAULT_META),clone(body));
  else if(d.id.startsWith('m-')) S.months[d.id]=clone(body.items||[]);
}
async function initCloud(){
  if(!window.claude||typeof window.claude.use!=='function'){setMode('local');return}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){setMode('local');return}
    const id=await user.id(); if(!id){setMode('local');return}
    col=db.collection('data/users/'+id);
    let settled=false;
    const timer=setTimeout(()=>{if(!settled)setMode('wait')},10000);
    col.onSnapshot(snap=>{
      if(!settled){
        if(snap.metadata.fromCache) return;
        settled=true;clearTimeout(timer);setMode('cloud');
        if(snap.empty){ // first time: move anything saved on this device up to the cloud
          if(allTx().length||JSON.stringify(S.meta)!==JSON.stringify(DEFAULT_META)){
            persist('meta');Object.keys(S.months).forEach(persist);
          }
        }else{
          S={meta:clone(DEFAULT_META),months:{}};
          snap.docs.forEach(applyDoc);saveLocal();
        }
        render();return;
      }
      let changed=false;
      snap.docChanges().forEach(ch=>{
        if(ch.type==='removed'){ if(!dirty[ch.doc.id]&&!writing[ch.doc.id]){ if(ch.doc.id==='meta')S.meta=clone(DEFAULT_META); else delete S.months[ch.doc.id]; changed=true} }
        else {applyDoc(ch.doc);changed=true}
      });
      if(changed){saveLocal();render()}
    },err=>{clearTimeout(timer);setMode('local')});
  }catch(e){setMode('local')}
}

/* ===================== computations ===================== */
function balances(){
  const b={};S.meta.accounts.forEach(a=>b[a.id]=Number(a.initial)||0);
  allTx().forEach(t=>{
    if(t.type==='income'){ if(b[t.account]!==undefined) b[t.account]+=t.amount }
    else if(t.type==='expense'){ if(b[t.account]!==undefined) b[t.account]-=t.amount }
    else if(t.type==='transfer'){ if(b[t.account]!==undefined) b[t.account]-=t.amount; if(b[t.toAccount]!==undefined) b[t.toAccount]+=t.amount }
  });return b;
}
function monthSums(y,m){let inc=0,exp=0;(S.months[mKey(y,m)]||[]).forEach(t=>{if(t.type==='income')inc+=t.amount;else if(t.type==='expense')exp+=t.amount});return{inc,exp}}
const sortTx=a=>a.slice().sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:(y.created||0)-(x.created||0));

/* ===================== view state ===================== */
const T=todayJ();
const V={tab:'home',y:T.jy,m:T.jm,ftype:'all',facc:'',fcat:'',scope:'month',q:''};
function shiftMonth(d){let m=V.m+d,y=V.y;if(m<1){m=12;y--}if(m>12){m=1;y++}V.y=y;V.m=m;render()}
$('#mPrev').onclick=()=>shiftMonth(-1); $('#mNext').onclick=()=>shiftMonth(1);
$('#mLabel').onclick=()=>{V.y=T.jy;V.m=T.jm;render()};
document.querySelectorAll('nav.tabs [data-tab]').forEach(b=>b.onclick=()=>{V.tab=b.dataset.tab;render();window.scrollTo(0,0)});
$('#addBtn').onclick=()=>openTx();

/* ===================== rendering ===================== */
function shortDate(s){const {jy,jm,jd}=parseJ(s);return `${fa(jd)} ${MONTHS[jm-1]}${jy!==T.jy?' '+fa(jy):''}`}
function dayGroups(list){const days={};sortTx(list).forEach(t=>(days[t.date]=days[t.date]||[]).push(t));return days}
function dayLabel(d){const td=jStr(T.jy,T.jm,T.jd),y=todayJ(-1),yd=jStr(y.jy,y.jm,y.jd);const {jd,jm}=parseJ(d);const jy=parseJ(d).jy;return (d===td?'امروز · ':d===yd?'دیروز · ':'')+`${weekday(d)} ${fa(jd)} ${MONTHS[jm-1]}${jy!==T.jy?' '+fa(jy):''}`}
function txRow(t){
  let icon,title,sub,cls,sign;
  if(t.type==='transfer'){const a=acc(t.account),b=acc(t.toAccount);icon='🔁';title=t.note||'انتقال';sub=`${a?a.name:'؟'} ← ${b?b.name:'؟'}`;cls='';sign=''}
  else{const c=cat(t.category);icon=c?c.icon:'❔';title=t.note||(c?c.name:'بدون دسته');sub=(c&&t.note?c.name+' · ':'')+(acc(t.account)?.name||'');cls=t.type==='income'?'pos':'neg';sign=t.type==='income'?'+':'−'}
  return `<button class="tx" data-tx="${t.id}"><span class="ic">${icon}</span><span class="mid"><div class="t">${esc(title)}</div><div class="s">${esc(sub)}</div></span><span class="end"><div class="amt ${cls}">${sign}${grp(t.amount)}</div><div class="d">${shortDate(t.date)}</div></span></button>`;
}
function bindTxRows(root){root.querySelectorAll('[data-tx]').forEach(el=>el.onclick=()=>{const t=allTx().find(x=>x.id===el.dataset.tx);if(t)openTx(t)})}

function render(){
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===V.tab));
  $('#monthbar').classList.toggle('hidden',V.tab==='settings');
  $('#mLabel').textContent=`${MONTHS[V.m-1]} ${fa(V.y)}`;
  const main=$('#main');
  ({home:renderHome,list:renderList,report:renderReport,settings:renderSettings})[V.tab](main);
}

function renderHome(main){
  const bal=balances();const total=Object.values(bal).reduce((a,b)=>a+b,0);
  const {inc,exp}=monthSums(V.y,V.m);
  const mtx=S.months[mKey(V.y,V.m)]||[];
  const budgets=S.meta.categories.filter(c=>c.type==='expense'&&c.budget>0);
  const spent={};mtx.forEach(t=>{if(t.type==='expense')spent[t.category]=(spent[t.category]||0)+t.amount});
  main.innerHTML=`
  <div class="card hero">
    <div class="lbl">موجودی کل</div>
    <div class="big">${money(total,true)} <span class="unit">${unit()}</span></div>
    <div class="stats">
      <div><span>درآمد ماه</span><b>${grp(inc)}</b></div>
      <div><span>هزینهٔ ماه</span><b>${grp(exp)}</b></div>
      <div><span>ماندهٔ ماه</span><b>${money(inc-exp,true)}</b></div>
    </div>
  </div>
  <div class="card"><h3>حساب‌ها <button class="linkbtn" id="goAcc">مدیریت</button></h3>
    <div class="accs">${S.meta.accounts.map(a=>`<div class="acc"><div class="n">${a.icon} ${esc(a.name)}</div><div class="v ${bal[a.id]<0?'neg':''}">${money(bal[a.id],true)}</div></div>`).join('')||'<div class="muted">حسابی ندارید</div>'}</div>
  </div>
  ${budgets.length?`<div class="card"><h3>بودجهٔ این ماه</h3>${budgets.map(c=>{const s=spent[c.id]||0,p=Math.min(100,s/c.budget*100),over=s>c.budget;
    return `<div class="budget"><div class="row"><span>${c.icon} ${esc(c.name)}</span><small class="${over?'neg':''}">${grp(s)} از ${grp(c.budget)}</small></div><div class="bar"><i style="width:${p}%;background:${over?'var(--red)':p>80?'var(--amber)':'var(--brand)'}"></i></div></div>`}).join('')}</div>`:''}
  <div class="card"><h3>تراکنش‌های ${MONTHS[V.m-1]} <small>${mtx.length?fa(mtx.length)+' مورد':''}</small></h3>
    ${mtx.length?Object.entries(dayGroups(mtx)).map(([d,ts])=>`<div class="dayhead" style="padding:10px 0 0"><span>${dayLabel(d)}</span></div>${ts.map(txRow).join('')}`).join(''):`<div class="empty">هنوز تراکنشی در این ماه ثبت نشده.<br>با دکمهٔ <b>+</b> پایین صفحه اولین هزینه یا درآمد را ثبت کنید.</div>`}
  </div>`;
  bindTxRows(main);
  $('#goAcc').onclick=()=>{V.tab='settings';render()};
}

function renderList(main){
  let list=V.scope==='all'?allTx():(S.months[mKey(V.y,V.m)]||[]);
  const q=toEn(V.q.trim()).toLowerCase();
  list=list.filter(t=>(V.ftype==='all'||t.type===V.ftype)&&(!V.facc||t.account===V.facc||t.toAccount===V.facc)&&
    (!V.fcat||t.category===V.fcat)&&
    (!q||[t.note,cat(t.category)?.name,acc(t.account)?.name,String(t.amount)].join(' ').toLowerCase().includes(q)));
  const days=dayGroups(list);
  const filtered=V.q||V.ftype!=='all'||V.facc||V.fcat;
  let inc=0,exp=0;list.forEach(t=>{if(t.type==='income')inc+=t.amount;else if(t.type==='expense')exp+=t.amount});
  const cats=S.meta.categories.filter(c=>V.ftype==='all'||V.ftype===c.type);
  const fc=cat(V.fcat);
  main.innerHTML=`
  <input class="search" id="q" placeholder="جستجو در یادداشت، دسته، مبلغ…" value="${esc(V.q)}">
  <div class="chips scroll">
    <button class="chip ${V.scope==='month'?'on':''}" data-sc="month">📅 فقط ${MONTHS[V.m-1]}</button>
    <button class="chip ${V.scope==='all'?'on':''}" data-sc="all">🗂️ همهٔ ماه‌ها</button>
    ${[['all','همهٔ انواع'],['expense','هزینه'],['income','درآمد'],['transfer','انتقال']].map(([k,l])=>`<button class="chip ${V.ftype===k?'on':''}" data-ft="${k}">${l}</button>`).join('')}
  </div>
  ${V.ftype!=='transfer'?`<div class="chips scroll">
    <button class="chip ${!V.fcat?'on':''}" data-fc="">همهٔ دسته‌ها</button>
    ${cats.map(c=>`<button class="chip ${V.fcat===c.id?'on':''}" data-fc="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('')}
  </div>`:''}
  <div class="chips scroll" style="margin-bottom:10px">
    <button class="chip ${!V.facc?'on':''}" data-fa="">همهٔ حساب‌ها</button>
    ${S.meta.accounts.map(a=>`<button class="chip ${V.facc===a.id?'on':''}" data-fa="${a.id}">${a.icon} ${esc(a.name)}</button>`).join('')}
  </div>
  ${filtered&&list.length?`<div class="card" style="padding:12px 14px">
    <div class="sumbar"><span class="muted">${fc?fc.icon+' '+esc(fc.name)+' · ':''}${fa(list.length)} تراکنش ${V.scope==='all'?'در همهٔ ماه‌ها':'در '+MONTHS[V.m-1]}</span>${(fc||V.facc||V.q)?`<button class="linkbtn" id="clr">حذف فیلترها</button>`:''}</div>
    <div class="sumbar" style="margin-top:8px">${exp?`<span>جمع هزینه<b class="neg">${grp(exp)}</b></span>`:''}${inc?`<span>جمع درآمد<b class="pos">${grp(inc)}</b></span>`:''}${inc&&exp?`<span>خالص<b>${money(inc-exp,true)}</b></span>`:''}</div>
  </div>`:''}
  ${Object.keys(days).length?Object.entries(days).map(([d,ts])=>{const net=ts.reduce((s,t)=>s+(t.type==='income'?t.amount:t.type==='expense'?-t.amount:0),0);
    return `<div class="dayhead"><span>${dayLabel(d)}</span><span class="${net<0?'neg':net>0?'pos':''}">${net?money(net,true):''}</span></div><div class="card" style="padding:4px 14px">${ts.map(txRow).join('')}</div>`}).join('')
    :`<div class="card empty">${filtered?'تراکنشی با این فیلتر پیدا نشد.':'تراکنشی در این ماه نیست.'}</div>`}`;
  const qi=$('#q');qi.oninput=()=>{V.q=qi.value;const pos=qi.selectionStart;renderList(main);const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  main.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{V.scope=b.dataset.sc;render()});
  main.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{V.ftype=b.dataset.ft;if(V.fcat&&cat(V.fcat)?.type!==V.ftype)V.fcat='';render()});
  main.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{V.fcat=b.dataset.fc;render()});
  main.querySelectorAll('[data-fa]').forEach(b=>b.onclick=()=>{V.facc=b.dataset.fa;render()});
  const clr=$('#clr');if(clr)clr.onclick=()=>{V.fcat='';V.facc='';V.q='';V.ftype='all';render()};
  // keep the selected chip visible in its row
  main.querySelectorAll('.chips.scroll .chip.on').forEach(c=>c.scrollIntoView({block:'nearest',inline:'nearest'}));
  bindTxRows(main);
}

function donut(items,total){
  const r=62,C=2*Math.PI*r;let off=0;
  const segs=items.map(it=>{const len=it.v/total*C;const s=`<circle r="${r}" cx="80" cy="80" fill="none" stroke="${it.color}" stroke-width="24" stroke-dasharray="${Math.max(len-1.5,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=len;return s}).join('');
  return `<svg viewBox="0 0 160 160" width="170" height="170" style="display:block;margin:0 auto"><circle r="${r}" cx="80" cy="80" fill="none" stroke="var(--card2)" stroke-width="24"/>${segs}
  <text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--muted)">کل هزینه</text><text x="80" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">${grp(total)}</text></svg>`;
}
function trend(){
  const pts=[];let y=V.y,m=V.m;for(let i=0;i<6;i++){pts.unshift({y,m,...monthSums(y,m)});m--;if(m<1){m=12;y--}}
  const max=Math.max(1,...pts.map(p=>Math.max(p.inc,p.exp)));
  const W=320,H=170,base=140,colW=W/6;
  // RTL: newest on the left end of reading flow → place oldest at right
  const bars=pts.map((p,i)=>{const x=W-(i+1)*colW+colW/2;const hi=p.inc/max*110,he=p.exp/max*110;
    return `<rect x="${x-13}" y="${base-hi}" width="12" height="${hi}" rx="3" fill="var(--green)"/><rect x="${x+1}" y="${base-he}" width="12" height="${he}" rx="3" fill="var(--red)"/>
    <text x="${x}" y="${base+18}" text-anchor="middle" font-size="10.5" fill="${p.y===V.y&&p.m===V.m?'var(--text)':'var(--muted)'}" font-weight="${p.y===V.y&&p.m===V.m?700:400}">${MONTHS[p.m-1]}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}</svg>
  <div class="chips" style="justify-content:center;gap:14px;font-size:12.5px"><span><i class="dot" style="background:var(--green)"></i> درآمد</span><span><i class="dot" style="background:var(--red)"></i> هزینه</span></div>`;
}
function renderReport(main){
  const mtx=S.months[mKey(V.y,V.m)]||[];
  const by={};mtx.forEach(t=>{if(t.type==='expense')by[t.category]=(by[t.category]||0)+t.amount});
  const total=Object.values(by).reduce((a,b)=>a+b,0);
  const ids=S.meta.categories.map(c=>c.id);
  const items=Object.entries(by).map(([id,v])=>{const c=cat(id);const idx=Math.max(0,ids.indexOf(id));return{id,v,name:c?c.name:'حذف‌شده',icon:c?c.icon:'❔',color:PALETTE[idx%PALETTE.length]}}).sort((a,b)=>b.v-a.v);
  const incBy={};mtx.forEach(t=>{if(t.type==='income')incBy[t.category]=(incBy[t.category]||0)+t.amount});
  const {inc,exp}=monthSums(V.y,V.m);
  main.innerHTML=`
  <div class="card"><h3>هزینه‌ها بر اساس دسته <small>${unit()}</small></h3>
    ${total?donut(items,total)+`<div class="list legend">${items.map(it=>`<button class="item" data-go="${it.id}"><span class="dot" style="background:${it.color}"></span><span class="ic" style="font-size:17px">${it.icon}</span><span class="mid">${esc(it.name)}<small>${fa((it.v/total*100).toFixed(1))}٪</small></span><b>${grp(it.v)}</b></button>`).join('')}</div>`
    :'<div class="empty">در این ماه هزینه‌ای ثبت نشده.</div>'}
  </div>
  <div class="card"><h3>روند ۶ ماه اخیر</h3>${trend()}</div>
  <div class="card"><h3>خلاصهٔ ${MONTHS[V.m-1]}</h3>
    <div class="list">
      <div class="item"><span class="mid">جمع درآمد</span><b class="pos">${grp(inc)}</b></div>
      ${Object.entries(incBy).map(([id,v])=>`<div class="item"><span class="ic" style="font-size:16px">${cat(id)?.icon||'❔'}</span><span class="mid muted">${esc(cat(id)?.name||'حذف‌شده')}</span><span>${grp(v)}</span></div>`).join('')}
      <div class="item"><span class="mid">جمع هزینه</span><b class="neg">${grp(exp)}</b></div>
      <div class="item"><span class="mid">پس‌انداز این ماه</span><b class="${inc-exp<0?'neg':'pos'}">${money(inc-exp,true)}</b></div>
      ${inc>0?`<div class="item"><span class="mid">نرخ پس‌انداز</span><b>${fa(Math.round((inc-exp)/inc*100))}٪</b></div>`:''}
    </div>
  </div>`;
  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{V.fcat=b.dataset.go;V.ftype='expense';V.facc='';V.q='';V.scope='month';V.tab='list';render();window.scrollTo(0,0)});
}

    <button class="btn ghost" id="bkCopy">📋 کپی پشتیبان به‌صورت متن</button>
    <button class="btn ghost" id="bkRestore">⬆️ بازگردانی از پشتیبان</button>
    <div class="note" style="margin-top:10px">${mode==='cloud'?'داده‌ها در فضای خصوصی شما در حساب Claude ذخیره می‌شوند و در هر دستگاهی که با همین حساب وارد شوید در دسترس‌اند. هیچ‌کس دیگری، حتی اگر این صفحه را با او به اشتراک بگذارید، داده‌های شما را نمی‌بیند.':'داده‌ها فقط روی همین گوشی ذخیره می‌شوند و بدون اینترنت هم کار می‌کند. هر چند وقت یک‌بار پشتیبان بگیرید و در Files یا Notes نگه دارید؛ اگر اپ را از صفحهٔ اصلی حذف کنید، داده‌هایش هم پاک می‌شود.'}</div>
  </div>
  <div class="card"><h3>نصب روی آیفون</h3>
    <div class="note">${standalone?'✅ اپ روی صفحهٔ اصلی نصب است و بدون اینترنت هم باز می‌شود.':'در <b>Safari</b> دکمهٔ <b>Share</b> (مربع با فلش رو به بالا) را بزنید و <b>Add to Home Screen</b> را انتخاب کنید. از آن به بعد همیشه اپ را از آیکون صفحهٔ اصلی باز کنید؛ بدون اینترنت هم کار می‌کند.'}</div>
  </div>
  <div class="card"><button class="btn danger" id="wipe">پاک کردن همهٔ داده‌ها</button></div>`;
  main.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>openAccount(acc(b.dataset.acc)));
  $('#addAcc').onclick=()=>openAccount(null);
  main.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>openCategory(cat(b.dataset.cat)));
  main.querySelectorAll('[data-addcat]').forEach(b=>b.onclick=()=>openCategory(null,b.dataset.addcat));
  main.querySelectorAll('#cur [data-u]').forEach(b=>b.onclick=()=>{S.meta.settings.currency=b.dataset.u;persist('meta');render()});
  $('#bkFile').onclick=backupFile; $('#bkCsv').onclick=exportCsv; $('#bkCopy').onclick=copyBackup; $('#bkRestore').onclick=openRestore;
  $('#wipe').onclick=wipeAll;
}

/* ===================== sheets & dialogs ===================== */
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#overlay').classList.add('show');$('#sheet').scrollTop=0}
function closeSheet(){$('#overlay').classList.remove('show')}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
function confirmBox(msg,ok='تأیید',danger=true){return new Promise(res=>{
  openSheet(`<h2>${msg}</h2><button class="btn ${danger?'danger':''}" id="cfOk">${ok}</button><button class="btn ghost" id="cfNo">انصراف</button>`);
  $('#cfOk').onclick=()=>{closeSheet();res(true)};$('#cfNo').onclick=()=>{closeSheet();res(false)};
})}
function dateFields(sel){const {jy,jm,jd}=parseJ(sel);
  const years=[];for(let y=T.jy+1;y>=T.jy-10;y--)years.push(y);
  return `<div class="row3">
    <select id="dD">${Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${d===jd?'selected':''}>${fa(d)}</option>`).join('')}</select>
    <select id="dM">${MONTHS.map((n,i)=>`<option value="${i+1}" ${i+1===jm?'selected':''}>${n}</option>`).join('')}</select>
    <select id="dY">${years.map(y=>`<option value="${y}" ${y===jy?'selected':''}>${fa(y)}</option>`).join('')}</select></div>
    <div class="chips" style="margin-top:6px"><button type="button" class="chip" data-dq="0">امروز</button><button type="button" class="chip" data-dq="-1">دیروز</button><button type="button" class="chip" data-dq="-2">پریروز</button></div>`;
}
function bindDate(){const set=j=>{$('#dY').value=j.jy;$('#dM').value=j.jm;$('#dD').value=j.jd};
  document.querySelectorAll('[data-dq]').forEach(b=>b.onclick=()=>set(todayJ(+b.dataset.dq)));}
function readDate(){const y=+$('#dY').value,m=+$('#dM').value;let d=+$('#dD').value;d=Math.min(d,monthLen(y,m));return jStr(y,m,d)}
function amountInput(id,val){return `<input id="${id}" inputmode="numeric" autocomplete="off" placeholder="۰" value="${val?grp(val):''}">`}
function bindAmount(id,hintId){const el=$('#'+id);const upd=()=>{const n=+toEn(el.value).replace(/[^\d]/g,'')||0;el.value=n?grp(n):'';if(hintId)$('#'+hintId).textContent=words(n)};el.addEventListener('input',upd);upd();return()=>+toEn(el.value).replace(/[^\d]/g,'')||0}

/* ---- transaction sheet ---- */
function openTx(t){
  const edit=!!t;
  const dflt=(V.y===T.jy&&V.m===T.jm)?jStr(T.jy,T.jm,T.jd):jStr(V.y,V.m,1);
  const st={type:t?.type||'expense',category:t?.category||'',account:t?.account||S.meta.accounts[0]?.id||'',toAccount:t?.toAccount||S.meta.accounts[1]?.id||''};
  if(!S.meta.accounts.length){toast('اول از تنظیمات یک حساب بسازید');V.tab='settings';render();return}
  let first=true;
  const draw=()=>{
    const cats=S.meta.categories.filter(c=>c.type===st.type);
    if(st.type!=='transfer'&&!cats.find(c=>c.id===st.category)) st.category=cats[0]?.id||'';
    const keepAmt=first?null:$('#amt')?.value, keepNote=first?null:$('#note')?.value, keepDate=(!first&&$('#dY'))?readDate():null;first=false;
    openSheet(`
      <h2>${edit?'ویرایش تراکنش':'ثبت تراکنش'} <button class="linkbtn" id="txClose">بستن</button></h2>
      <div class="seg">${[['expense','هزینه','exp'],['income','درآمد','inc'],['transfer','انتقال','trf']].map(([k,l,c])=>`<button class="${c} ${st.type===k?'on':''}" data-type="${k}">${l}</button>`).join('')}</div>
      <div class="amountbox">${amountInput('amt',t?.amount)}<div class="hint" id="amtHint"></div></div>
      ${st.type==='transfer'?`
        <div class="row2"><div class="field"><label>از حساب</label><select id="fromA">${S.meta.accounts.map(a=>`<option value="${a.id}" ${a.id===st.account?'selected':''}>${a.icon} ${esc(a.name)}</option>`).join('')}</select></div>
        <div class="field"><label>به حساب</label><select id="toA">${S.meta.accounts.map(a=>`<option value="${a.id}" ${a.id===st.toAccount?'selected':''}>${a.icon} ${esc(a.name)}</option>`).join('')}</select></div></div>`
      :`<div class="field"><label>دسته</label><div class="catgrid">${cats.map(c=>`<button class="cat ${c.id===st.category?'on':''}" data-c="${c.id}"><b>${c.icon}</b>${esc(c.name)}</button>`).join('')}</div></div>
        <div class="field"><label>حساب</label><select id="fromA">${S.meta.accounts.map(a=>`<option value="${a.id}" ${a.id===st.account?'selected':''}>${a.icon} ${esc(a.name)}</option>`).join('')}</select></div>`}
      <div class="field"><label>تاریخ</label>${dateFields(keepDate||t?.date||dflt)}</div>
      <div class="field"><label>یادداشت (اختیاری)</label><input id="note" maxlength="120" placeholder="مثلاً خرید نان" value="${esc(t?.note||'')}"></div>
      <button class="btn" id="txSave">${edit?'ذخیرهٔ تغییرات':'ثبت'}</button>
      ${edit?'<button class="btn danger" id="txDel">حذف تراکنش</button>':''}`);
    if(keepAmt!==undefined&&keepAmt!==null) $('#amt').value=keepAmt;
    if(keepNote!==undefined&&keepNote!==null) $('#note').value=keepNote;
    const getAmt=bindAmount('amt','amtHint');bindDate();
    $('#txClose').onclick=closeSheet;
    document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{st.type=b.dataset.type;st.account=$('#fromA').value;draw()});
    document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{st.category=b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b))});
    $('#txSave').onclick=()=>{
      const amount=getAmt(); if(!amount){toast('مبلغ را وارد کنید');$('#amt').focus();return}
      const from=$('#fromA').value, to=$('#toA')?.value;
      if(st.type==='transfer'&&from===to){toast('حساب مبدأ و مقصد یکی است');return}
      if(st.type!=='transfer'&&!st.category){toast('یک دسته انتخاب کنید');return}
      const rec={id:t?.id||uid(),type:st.type,amount,account:from,date:readDate(),note:$('#note').value.trim(),created:t?.created||Date.now()};
      if(st.type==='transfer')rec.toAccount=to; else rec.category=st.category;
      const keys=new Set();
      if(t){const ok=keyOfDate(t.date);S.months[ok]=(S.months[ok]||[]).filter(x=>x.id!==t.id);keys.add(ok)}
      const nk=keyOfDate(rec.date);(S.months[nk]=S.months[nk]||[]).push(rec);keys.add(nk);
      keys.forEach(persist);closeSheet();
      const {jy,jm}=parseJ(rec.date);V.y=jy;V.m=jm;render();toast(edit?'ذخیره شد':'ثبت شد');
    };
    if(edit) $('#txDel').onclick=async()=>{if(await confirmBox('این تراکنش حذف شود؟','حذف')){const k=keyOfDate(t.date);S.months[k]=(S.months[k]||[]).filter(x=>x.id!==t.id);persist(k);render();toast('حذف شد')}else openTx(t)};
  };
  draw();
}

/* ---- account sheet ---- */
const ACC_ICONS=['💵','💳','🏦','👛','💰','📱','🪙','🏧'];
function openAccount(a){
  let icon=a?.icon||'💳';
  openSheet(`<h2>${a?'ویرایش حساب':'حساب جدید'} <button class="linkbtn" id="x">بستن</button></h2>
    <div class="field"><label>نام حساب</label><input id="an" maxlength="40" placeholder="مثلاً کارت ملت" value="${esc(a?.name||'')}"></div>
    <div class="field"><label>آیکون</label><div class="chips" id="ai">${ACC_ICONS.map(i=>`<button class="chip ${i===icon?'on':''}" data-i="${i}" style="font-size:18px">${i}</button>`).join('')}</div></div>
    <div class="field"><label>موجودی اولیه (${unit()})</label><input id="ainit" inputmode="numeric" placeholder="۰" value="${a?.initial?grp(a.initial):''}"><div class="note" style="margin:4px">اگر حساب منفی (بدهکار) است، اول عدد علامت منفی بگذارید.</div></div>
    <button class="btn" id="as">ذخیره</button>${a?'<button class="btn danger" id="ad">حذف حساب</button>':''}`);
  $('#x').onclick=closeSheet;
  document.querySelectorAll('#ai [data-i]').forEach(b=>b.onclick=()=>{icon=b.dataset.i;document.querySelectorAll('#ai [data-i]').forEach(x=>x.classList.toggle('on',x===b))});
  const ai=$('#ainit');ai.oninput=()=>{const raw=toEn(ai.value);const neg=/^\s*[-−]/.test(raw);const n=+raw.replace(/[^\d]/g,'')||0;ai.value=(neg?'−':'')+(n?grp(n):'')};
  $('#as').onclick=()=>{const name=$('#an').value.trim();if(!name){toast('نام حساب را بنویسید');return}
    const raw=toEn(ai.value);const n=(+raw.replace(/[^\d]/g,'')||0)*(/^\s*[-−]/.test(raw)?-1:1);
    if(a){a.name=name;a.icon=icon;a.initial=n}else S.meta.accounts.push({id:uid(),name,icon,initial:n});
    persist('meta');closeSheet();render()};
  if(a)$('#ad').onclick=async()=>{const used=allTx().some(t=>t.account===a.id||t.toAccount===a.id);
    if(used){toast('این حساب تراکنش دارد؛ اول آن‌ها را حذف یا جابه‌جا کنید');return}
    if(await confirmBox(`حساب «${esc(a.name)}» حذف شود؟`,'حذف')){S.meta.accounts=S.meta.accounts.filter(x=>x.id!==a.id);persist('meta');render()}};
}

/* ---- category sheet ---- */
const CAT_ICONS=['🍽️','🛒','🚕','⛽','💡','🏠','📄','👕','💊','🎬','📚','🎁','📦','☕','✈️','🐾','👶','💇','🔧','📱','💼','🛍️','📈','➕','💸','🏋️','🎮','🧾'];
function openCategory(c,type){
  type=c?.type||type;let icon=c?.icon||'📦';
  openSheet(`<h2>${c?'ویرایش دسته':'دستهٔ جدید '+(type==='income'?'درآمد':'هزینه')} <button class="linkbtn" id="x">بستن</button></h2>
    <div class="field"><label>نام دسته</label><input id="cn" maxlength="30" value="${esc(c?.name||'')}"></div>
    <div class="field"><label>آیکون</label><div class="chips" id="ci">${CAT_ICONS.map(i=>`<button class="chip ${i===icon?'on':''}" data-i="${i}" style="font-size:18px">${i}</button>`).join('')}</div></div>
    ${type==='expense'?`<div class="field"><label>بودجهٔ ماهانه (${unit()}) — خالی یعنی بدون بودجه</label>${amountInput('cb',c?.budget)}</div>`:''}
    <button class="btn" id="cs">ذخیره</button>${c?'<button class="btn danger" id="cd">حذف دسته</button>':''}`);
  $('#x').onclick=closeSheet;
  document.querySelectorAll('#ci [data-i]').forEach(b=>b.onclick=()=>{icon=b.dataset.i;document.querySelectorAll('#ci [data-i]').forEach(x=>x.classList.toggle('on',x===b))});
  const getB=type==='expense'?bindAmount('cb'):()=>0;
  $('#cs').onclick=()=>{const name=$('#cn').value.trim();if(!name){toast('نام دسته را بنویسید');return}
    if(c){c.name=name;c.icon=icon;c.budget=getB()}else S.meta.categories.push({id:uid(),name,icon,type,budget:getB()});
    persist('meta');closeSheet();render()};
  if(c)$('#cd').onclick=async()=>{const used=allTx().some(t=>t.category===c.id);
    if(await confirmBox(used?`«${esc(c.name)}» در تراکنش‌ها استفاده شده؛ آن تراکنش‌ها «بدون دسته» می‌شوند. حذف شود؟`:`دستهٔ «${esc(c.name)}» حذف شود؟`,'حذف')){S.meta.categories=S.meta.categories.filter(x=>x.id!==c.id);persist('meta');render()}};
}

/* ===================== backup ===================== */
const backupJson=()=>JSON.stringify({app:'hesab-man',version:1,exported:new Date().toISOString(),meta:S.meta,months:S.months},null,1);
const stamp=()=>{const j=todayJ();return `${j.jy}-${pad(j.jm)}-${pad(j.jd)}`};
async function saveFile(filename,data){
  const type=filename.endsWith('.csv')?'text/csv':'application/json';
  try{
    const file=new File([data],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('فایل ذخیره شد')}
  catch(e){toast('ذخیرهٔ فایل ممکن نشد؛ از «کپی پشتیبان» استفاده کنید')}
}
function backupFile(){saveFile(`hesab-backup-${stamp()}.json`,backupJson())}
function exportCsv(){
  const tl={expense:'هزینه',income:'درآمد',transfer:'انتقال'};
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['تاریخ','نوع','مبلغ','دسته','حساب','به حساب','یادداشت'].map(q).join(',')];
  sortTx(allTx()).reverse().forEach(t=>rows.push([t.date.replace(/-/g,'/'),tl[t.type],t.amount,cat(t.category)?.name||'',acc(t.account)?.name||'',acc(t.toAccount)?.name||'',t.note].map(q).join(',')));
  saveFile(`hesab-${stamp()}.csv`,'﻿'+rows.join('\r\n'));
}
async function copyBackup(){try{await navigator.clipboard.writeText(backupJson());toast('کپی شد؛ در Notes ذخیره‌اش کنید')}catch(e){
  openSheet(`<h2>متن پشتیبان <button class="linkbtn" id="x">بستن</button></h2><div class="field"><textarea id="bt" readonly></textarea></div><div class="note">متن بالا را انتخاب و کپی کنید.</div>`);$('#bt').value=backupJson();$('#x').onclick=closeSheet}}
function openRestore(){
  openSheet(`<h2>بازگردانی از پشتیبان <button class="linkbtn" id="x">بستن</button></h2>
    <div class="note" style="margin-bottom:10px">داده‌های فعلی با محتوای پشتیبان <b>جایگزین</b> می‌شوند.</div>
    <button class="btn ghost" id="rf">انتخاب فایل JSON</button>
    <div class="field" style="margin-top:12px"><label>یا متن پشتیبان را اینجا بچسبانید</label><textarea id="rt"></textarea></div>
    <button class="btn" id="rs">بازگردانی از متن</button>`);
  $('#x').onclick=closeSheet;
  $('#rf').onclick=()=>$('#fileIn').click();
  $('#rs').onclick=()=>restore($('#rt').value);
}
$('#fileIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;restore(await f.text());e.target.value=''};
async function restore(text){
  let o;try{o=JSON.parse(text)}catch(e){toast('متن پشتیبان معتبر نیست');return}
  if(!o||!o.meta||!o.months||!Array.isArray(o.meta.accounts)){toast('این فایل پشتیبان «حساب من» نیست');return}
  if(!await confirmBox('همهٔ داده‌های فعلی با پشتیبان جایگزین شود؟','جایگزین کن'))return;
  const old=Object.keys(S.months);
  S={meta:Object.assign(clone(DEFAULT_META),o.meta),months:o.months};
  old.forEach(k=>{if(!S.months[k])S.months[k]=[]});
  persist('meta');Object.keys(S.months).forEach(persist);render();toast('بازگردانی انجام شد');
}
async function wipeAll(){
  if(!await confirmBox('همهٔ حساب‌ها، دسته‌ها و تراکنش‌ها برای همیشه پاک شوند؟ (اول پشتیبان بگیرید)','پاک کن'))return;
  const keys=Object.keys(S.months);
  S={meta:clone(DEFAULT_META),months:{}};keys.forEach(k=>S.months[k]=[]);
  persist('meta');keys.forEach(persist);render();toast('پاک شد');
}

/* ===================== start ===================== */
const standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
mode='local';render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
/* offline readiness */
async function offlineStatus(){
  const el=$('#sync');
  if(!('serviceWorker' in navigator)||!window.caches){el.textContent='📱 ذخیره روی همین گوشی';return}
  try{
    const ks=await caches.keys();let ok=false;
    for(const k of ks){const c=await caches.open(k);if(await c.match('./index.html')){ok=true;break}}
    ok=ok&&!!navigator.serviceWorker.controller;
    el.textContent=ok?'✅ آماده برای آفلاین':'⏳ در حال آماده‌سازی آفلاین…';
    if(!ok) setTimeout(offlineStatus,1500);
  }catch(e){}
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(r=>{r.update().catch(()=>{});offlineStatus()}).catch(()=>{$('#sync').textContent='📱 ذخیره روی همین گوشی'});
  navigator.serviceWorker.addEventListener('controllerchange',offlineStatus);
}
